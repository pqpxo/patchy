services:
  db:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patchy}
      POSTGRES_USER: ${POSTGRES_USER:-patchy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    # No ports published: only the app and worker reach the database.

  app:
    build: .
    image: patchy:local
    restart: unless-stopped
    env_file: .env
    environment: &dburl
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-patchy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-patchy}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  worker:
    image: patchy:local
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment: *dburl
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/patchy-worker-heartbeat') < 120 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
